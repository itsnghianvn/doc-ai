services:
  postgres:
    image: postgres:17-alpine
    container_name: docai-postgres
    environment:
      POSTGRES_DB: docai
      POSTGRES_USER: docai
      POSTGRES_PASSWORD: docai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docai -d docai"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: docai-qdrant

    ports:
      - "6333:6333"

    volumes:
      - qdrant_data:/qdrant/storage
    
volumes:
  postgres_data:
  qdrant_data: